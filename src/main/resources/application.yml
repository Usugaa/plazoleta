spring:
  application:
    name: restaurant

  datasource:
    url: jdbc:mysql://localhost:3306/plazoleta
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jta:
          platform: org.hibernate.engine.transaction.jta.platform.internal.JBossStandAloneJtaPlatform
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

logging:
  level:
    feign:
      client: debug

server:
  port: 8080

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: FULL

security:
  jwt:
    secret-key: pZcC7jT4kY5i9zUkHQ7T8kNZn1wXNCMoaLwHe4j3cG4=
    expiration-time: 86400000 # Tiempo en milisegundos (24 horas)
    refresh-token:
      expiration: 604800000 # (7 dias)

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    filter: true